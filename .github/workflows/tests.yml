name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }} / Laravel 13

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-check-lock

      - name: Install supported dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Check PHP syntax
        run: find src tests database config -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Execute tests
        run: vendor/bin/pest --ci

  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan / PHP 8.4 / Laravel 13

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install supported dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress
